<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Precision French Synthesis Fix</title>
    <!-- Core 3D engine and Augmented Reality frameworks -->
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <style>
        #audioButton {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999 !important;
            pointer-events: auto !important;
            background-color: #d11a2a; /* Custom Precision French brand red */
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            width: 85%;
            max-width: 280px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- High-priority button container -->
    <button id="audioButton" onclick="initializeSynthEngine()">🔊 CALIBRATE AUDIO LAYER</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <!-- Floats a bright red block over your tracking marker -->
            <a-box position="0 0.5 0" material="color: #d11a2a;"></a-box>
        </a-marker>
        
    </a-scene>

    <script>
        let audioCtx = null;

        function initializeSynthEngine() {
            // 1. Initialize the browser context natively to bypass external file security blocks
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // 2. Play a rapid diagnostic tone pattern to confirm hardware activation
            playDiagnosticTone(440, 0.1);  // Note A
            setTimeout(() => playDiagnosticTone(554.37, 0.1), 120); // Note C#
            setTimeout(() => playDiagnosticTone(659.25, 0.3), 240); // Note E

            // 3. Update the interface layer button status
            let btn = document.getElementById("audioButton");
            btn.innerHTML = "✅ SYSTEM READY - SCAN HIRO";
            btn.style.backgroundColor = "#00cc66";
        }

        function playDiagnosticTone(frequency, duration) {
            if (!audioCtx) return;
            
            let oscillator = audioCtx.createOscillator();
            let gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            
            // Manage clean volume curves to prevent loud crackles
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }
    </script>
</body>
</html>
