<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Precision French Test</title>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <div style="position: absolute; top: 10px; left: 10px; z-index: 999; background: white; padding: 15px; border-radius: 5px; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3);">
        📢 STEP 1: Tap this text box first!<br>
        📷 STEP 2: Point camera at a Hiro marker!
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <!-- Standard MP3 streaming file configuration for universal mobile support -->
            <audio id="testAudio" src="https://soundhelix.com" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #ff0000;"></a-box>
        </a-marker>

        
    </a-scene>

    <script>
        // Universal touch interface interaction unlock
        document.body.addEventListener('click', function() {
            var audio = document.querySelector("#testAudio");
            audio.play().then(() => {
                alert("🔊 Audio system unlocked and playing successfully!");
            }).catch(e => {
                console.log("Playback blocked:", e);
            });
        });
    </script>
</body>
</html>
