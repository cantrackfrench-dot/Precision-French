<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Precision French Scanner</title>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <style>
        #audioButton {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999 !important;
            pointer-events: auto !important;
            background-color: #0044ff;
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            width: 80%;
            max-width: 280px;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- Touch interface to activate audio routing hardware -->
    <button id="audioButton" onclick="startFrenchAudio()">📢 TAP TO START SCANNER</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <!-- Points to a secure, pre-hosted universal MP3 streaming link -->
            <audio id="frenchLesson" src="https://onlinetestcase.com" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <!-- Triggers actions when pointing at a standard Hiro marker -->
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #ff0000;"></a-box>
        </a-marker>

        
    </a-scene>

    <script>
        function startFrenchAudio() {
            var audio = document.querySelector("#frenchLesson");
            var button = document.getElementById("audioButton");

            // Build out clean mobile browser context handling
            window.AudioContext = window.AudioContext || window.webkitAudioContext;
            var context = new AudioContext();
            if (context.state === 'suspended') {
                context.resume();
            }

            // Play track cleanly
            audio.play().then(() => {
                button.innerHTML = "✅ ACTIVE - AIM AT HIRO MARKER";
                button.style.backgroundColor = "#00cc66";
            }).catch(e => {
                alert("Audio system blocked: " + e.message);
            });
        }
    </script>
</body>
</html>
