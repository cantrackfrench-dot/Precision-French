<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Precision French - AR Audio Scanner</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.0/three.js/ar.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* AR Scene */
        a-scene {
            width: 100%;
            height: 100%;
        }

        /* Master Gateway Sidebar */
        #gateway {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 100;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            color: white;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #gateway.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .gateway-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .gateway-header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .gateway-header p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .lessons-list {
            flex: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            padding-right: 5px;
        }

        .lesson-item {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .lesson-item:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
        }

        .lesson-number {
            font-weight: bold;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .lesson-title {
            font-size: 0.75em;
            line-height: 1.2;
            opacity: 0.9;
        }

        .toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 101;
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .toggle-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        /* Current Lesson Display */
        #currentLesson {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            font-weight: bold;
            min-width: 250px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        #currentLesson.visible {
            opacity: 1;
        }

        /* Audio Controls */
        #controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        button.control-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        button.control-btn:hover {
            background: #764ba2;
            transform: scale(1.05);
        }

        button.control-btn:active {
            transform: scale(0.98);
        }

        /* Marker Status */
        #markerStatus {
            position: fixed;
            bottom: 120px;
            right: 20px;
            z-index: 50;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.9em;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-dot.scanning {
            background: #ffa500;
            animation: pulse 1s infinite;
        }

        .status-dot.detected {
            background: #00cc66;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Scrollbar styling */
        .lessons-list::-webkit-scrollbar {
            width: 6px;
        }

        .lessons-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .lessons-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        .lessons-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- Master Gateway -->
    <div id="gateway">
        <div class="gateway-header">
            <h1>📚 Precision French</h1>
            <p>Strategic Guide to DELF Preparation</p>
            <p style="font-size: 0.8em; margin-top: 10px; opacity: 0.8;">Point your phone at a lesson marker to start</p>
        </div>
        <div class="lessons-list" id="lessonsList">
            <!-- Populated by JavaScript -->
        </div>
    </div>

    <!-- AR Scene -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" id="arScene">
        <a-assets id="audioAssets">
            <!-- Audio elements loaded dynamically -->
        </a-assets>

        <!-- Markers for all 40 lessons -->
        <div id="markersContainer">
            <!-- Populated by JavaScript -->
        </div>

        <a-camera position="0 0 0" look-controls wasd-controls></a-camera>
    </a-scene>

    <!-- UI Elements -->
    <button class="toggle-btn" id="toggleBtn" onclick="toggleGateway()">📖 Menu</button>

    <div id="currentLesson">
        No lesson detected
    </div>

    <div id="markerStatus">
        <span class="status-dot scanning"></span>
        <span id="statusText">Scanning for markers...</span>
    </div>

    <div id="controls">
        <button class="control-btn" id="playBtn" onclick="playAudio()">▶️ Play</button>
        <button class="control-btn" id="pauseBtn" onclick="pauseAudio()">⏸️ Pause</button>
        <button class="control-btn" id="stopBtn" onclick="stopAudio()">⏹️ Stop</button>
    </div>

    <script>
        // Lesson data - expandable to 40
        const lessons = [
            { id: 1, title: "Greetings & Introductions", duration: "3:45" },
            { id: 2, title: "Travel: At the Airport", duration: "4:20" },
            { id: 3, title: "Restaurant & Food", duration: "5:10" },
            { id: 4, title: "Shopping & Haggling", duration: "4:00" },
            { id: 5, title: "Hotel & Accommodation", duration: "3:50" },
            { id: 6, title: "Asking Directions", duration: "3:30" },
            { id: 7, title: "Movies & Entertainment", duration: "4:15" },
            { id: 8, title: "Sports & Hobbies", duration: "4:45" },
            { id: 9, title: "Weather & Nature", duration: "3:40" },
            { id: 10, title: "Family & Relationships", duration: "4:05" },
            { id: 11, title: "Health & Medical", duration: "4:30" },
            { id: 12, title: "Work & Career", duration: "5:00" },
            { id: 13, title: "Education & Studies", duration: "4:20" },
            { id: 14, title: "Technology & Internet", duration: "4:10" },
            { id: 15, title: "Music & Arts", duration: "4:35" },
            { id: 16, title: "Food Recipes & Cooking", duration: "5:15" },
            { id: 17, title: "Fashion & Clothing", duration: "3:55" },
            { id: 18, title: "Transportation", duration: "4:25" },
            { id: 19, title: "Housing & Furniture", duration: "4:40" },
            { id: 20, title: "Money & Finance", duration: "4:50" },
            { id: 21, title: "Time & Scheduling", duration: "3:25" },
            { id: 22, title: "Numbers & Counting", duration: "3:15" },
            { id: 23, title: "Colors & Descriptions", duration: "3:45" },
            { id: 24, title: "Animals & Pets", duration: "4:00" },
            { id: 25, title: "Plants & Gardening", duration: "4:10" },
            { id: 26, title: "Politics & Current Events", duration: "5:30" },
            { id: 27, title: "History & Culture", duration: "5:45" },
            { id: 28, title: "Geography & Cities", duration: "4:55" },
            { id: 29, title: "Literature & Books", duration: "5:20" },
            { id: 30, title: "Science & Technology", duration: "5:05" },
            { id: 31, title: "DELF Listening Practice 1", duration: "6:00" },
            { id: 32, title: "DELF Listening Practice 2", duration: "6:15" },
            { id: 33, title: "DELF Speaking Tips", duration: "5:40" },
            { id: 34, title: "DELF Reading Strategies", duration: "5:30" },
            { id: 35, title: "DELF Writing Guide", duration: "6:00" },
            { id: 36, title: "Common Mistakes", duration: "4:45" },
            { id: 37, title: "Pronunciation Practice", duration: "5:15" },
            { id: 38, title: "Slang & Colloquialisms", duration: "4:30" },
            { id: 39, title: "Business French", duration: "5:50" },
            { id: 40, title: "Exam Day Checklist", duration: "3:20" }
        ];

        let currentLesson = null;
        let currentAudio = null;

        // Initialize gateway menu
        function initGateway() {
            const listContainer = document.getElementById('lessonsList');
            lessons.forEach(lesson => {
                const item = document.createElement('div');
                item.className = 'lesson-item';
                item.innerHTML = `
                    <div class="lesson-number">${String(lesson.id).padStart(2, '0')}</div>
                    <div class="lesson-title">${lesson.title}</div>
                    <div style="font-size: 0.7em; margin-top: 5px; opacity: 0.7;">${lesson.duration}</div>
                `;
                item.onclick = () => selectLesson(lesson.id);
                listContainer.appendChild(item);
            });
        }

        // Initialize AR markers
        function initMarkers() {
            const container = document.getElementById('markersContainer');
            const scene = document.getElementById('arScene');

            lessons.forEach(lesson => {
                // Create marker element
                const marker = document.createElement('a-marker');
                marker.setAttribute('id', `marker-${lesson.id}`);
                marker.setAttribute('preset', 'hiro'); // Using Hiro marker for all (you can customize)
                marker.setAttribute('emitevents', 'true');

                // Add visual feedback
                const text = document.createElement('a-text');
                text.setAttribute('value', `${String(lesson.id).padStart(2, '0')}. ${lesson.title}`);
                text.setAttribute('position', '0 1 0');
                text.setAttribute('scale', '0.5 0.5 0.5');
                text.setAttribute('color', '#667eea');
                text.setAttribute('align', 'center');
                marker.appendChild(text);

                const box = document.createElement('a-box');
                box.setAttribute('position', '0 0.5 0');
                box.setAttribute('scale', '0.5 0.5 0.5');
                box.setAttribute('material', 'color: #667eea');
                marker.appendChild(box);

                // Marker detection events
                marker.addEventListener('markerFound', () => {
                    selectLesson(lesson.id);
                    playAudio();
                });

                marker.addEventListener('markerLost', () => {
                    pauseAudio();
                });

                scene.appendChild(marker);
            });
        }

        // Select a lesson
        function selectLesson(lessonId) {
            currentLesson = lessons.find(l => l.id === lessonId);
            if (!currentLesson) return;

            // Update display
            const display = document.getElementById('currentLesson');
            display.textContent = `${String(currentLesson.id).padStart(2, '0')}. ${currentLesson.title}`;
            display.classList.add('visible');

            // Create or get audio element
            let audio = document.getElementById(`audio-${lessonId}`);
            if (!audio) {
                audio = document.createElement('audio');
                audio.id = `audio-${lessonId}`;
                audio.src = `/audio/lesson-${String(lessonId).padStart(2, '0')}.mp3`;
                audio.crossOrigin = 'anonymous';
                document.getElementById('audioAssets').appendChild(audio);
            }
            currentAudio = audio;

            // Update status
            updateStatus('Lesson selected - ready to scan');
        }

        // Audio controls
        function playAudio() {
            if (currentAudio) {
                currentAudio.play().catch(e => {
                    console.log('Play error:', e);
                    alert('Could not play audio. Make sure the file exists: ' + currentAudio.src);
                });
                updateStatus('▶️ Playing');
            }
        }

        function pauseAudio() {
            if (currentAudio) {
                currentAudio.pause();
                updateStatus('⏸️ Paused');
            }
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                updateStatus('Lesson stopped');
            }
        }

        // Toggle gateway visibility
        function toggleGateway() {
            const gateway = document.getElementById('gateway');
            gateway.classList.toggle('hidden');
        }

        // Update status indicator
        function updateStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            initGateway();
            initMarkers();
            
            // Resume audio context on user interaction
            document.addEventListener('click', () => {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }
            }, { once: true });

            // Hide gateway by default on mobile
            if (window.innerWidth < 768) {
                document.getElementById('gateway').classList.add('hidden');
            }
        });
    </script>

</body>
</html>
