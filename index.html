<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Precision French Test</title>
    <script src="https://aframe.io"></script>
    <script src="https://githack.com"></script>
    <style>
        /* Force the button layer to remain directly on top of the camera canvas */
        #audioButton {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999 !important;
            pointer-events: auto !important;
            background-color: #ff0000;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body style="margin: 0; overflow: hidden;">

    <!-- This button is explicitly configured to handle the iOS/Android touch activation -->
    <button id="audioButton" onclick="startAudio()">🔊 ACTIVATE AUDIO FIRST</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-assets>
            <audio id="testAudio" src="https://soundhelix.com" preload="auto" crossorigin="anonymous"></audio>
        </a-assets>

        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #ff0000;"></a-box>
        </a-marker>

        
    </a-scene>

    <script>
        function startAudio() {
            var audio = document.querySelector("#testAudio");
            var button = document.getElementById("audioButton");
            
            audio.play().then(() => {
                // Change button appearance to confirm it works
                button.innerHTML = "✅ AUDIO RUNNING - SCAN NOW";
                button.style.backgroundColor = "#00cc66";
            }).catch(e => {
                alert("Playback error: " + e.message);
            });
        }
    </script>
</body>
</html>
